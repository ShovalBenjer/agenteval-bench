[project]
name = "agenteval-bench"
version = "0.1.0"
description = "Production-grade CLI for evaluating, grading, and comparing LLM agent outputs with deterministic scoring, regression tracking, and CI integration."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Shoval Benjer" }]
keywords = ["llm", "agent", "evaluation", "benchmark", "mlops", "ci", "testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/ShovalBenjer/agenteval-bench"
Repository = "https://github.com/ShovalBenjer/agenteval-bench"
Issues = "https://github.com/ShovalBenjer/agenteval-bench/issues"
Changelog = "https://github.com/ShovalBenjer/agenteval-bench/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
lint = [
    "ruff>=0.5",
    "mypy>=1.10",
]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
]

[project.scripts]
agenteval-bench = "agenteval_bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agenteval_bench"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_any_generics = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["agenteval_bench"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W", "Q"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --cov=agenteval_bench --cov-fail-under=80"
