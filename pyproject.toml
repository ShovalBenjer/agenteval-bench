[project]
name = "agenteval-bench"
version = "0.1.0"
description = "Production-grade CLI for evaluating, grading, and comparing LLM agent outputs with deterministic scoring, regression tracking, and CI integration."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Shoval Benjer" }]
keywords = ["llm", "agent", "evaluation", "benchmark", "mlops", "ci", "testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
agenteval-bench = "agenteval_bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agenteval_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 100
