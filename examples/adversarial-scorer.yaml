name: adversarial-scorer-probes
version: 1
# Adversarial rows for the deterministic scorer. Each row is a recorded agent
# `output` that probes a weakness of one matcher. All rows PASS as recorded —
# the comments say what each one catches and where the matcher is known-blind.
# Run: agenteval-bench run --suite examples/adversarial-scorer.yaml --threshold 1.0
cases:
  - id: anchored-regex-vs-keyword-stuffing
    input: "How long do I have to request a refund?"
    output: "You can request a refund within 14 days of purchase."
    expected:
      # PROBE: an anchored regex resists keyword stuffing. An output like
      # "refund refund 14 days 14 days!!!" would PASS a `contains` check and
      # FAIL this one. Prefer anchored patterns over bare `contains` for
      # correctness-critical claims.
      regex: "^You can request a refund within 14 days of purchase\\.$"

  - id: exact-json-canonical
    input: "Return the status of order 5512 as JSON."
    output: '{"order_id": 5512, "status": "shipped"}'
    expected:
      # PROBE: `exact` is the strictest matcher — key reordering or extra keys
      # fail it. Use it when the downstream consumer is a parser, not a human.
      exact: '{"order_id": 5512, "status": "shipped"}'

  - id: negation-blind-spot
    input: "How long do I have to request a refund?"
    output: "You cannot request a refund after 14 days have passed, but you can within 14 days of purchase."
    expected:
      # KNOWN BLIND SPOT: `contains` cannot see negation. This output passes,
      # and so would "You can NEVER get a refund, 14 days or not." Do not use
      # `contains` alone for correctness-critical claims; pair it with an
      # anchored regex or an LLM judge with a rubric.
      contains: ["14 days", "refund"]

  - id: case-sensitive-needles
    input: "How long do I have to request a refund?"
    output: "You can request a refund within 14 days of purchase."
    expected:
      # PROBE: `contains` is case-SENSITIVE. "14 DAYS" would fail this needle.
      # That is a feature for precise claims and a trap for sloppy needles —
      # keep needles in the exact case the correct answer uses.
      contains: ["14 days"]

  - id: json-extra-keys-ignored
    input: "Return the status of order 5512 as JSON."
    output: '{"order_id": 5512, "status": "shipped", "admin": true}'
    expected:
      # KNOWN BLIND SPOT: `json_schema` with `required` ignores extra keys.
      # A smuggled "admin": true passes. If extra keys are a threat model,
      # use `exact` (see exact-json-canonical) instead of `required`.
      json_schema:
        required: ["order_id", "status"]
