name: secret-scan
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        run: |
          set -e
          PATTERNS='(ghp_|gho_|github_pat_|sk-ant-|xox[bap]-|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----|"?(api[_-]?key|secret|password)"?\s*[:=]\s*"[^"]{8,}")'
          if git grep -n -i -E "$PATTERNS" -- ':!*.lock' ':!package-lock.json' ':!bun.lock' ':!Cargo.lock' ':!*.md' | grep -v -E 'secret-scan.yml|ghp_\.\.\.|EXAMPLE|xxx'; then
            echo "Possible committed secret found."; exit 1
          fi
          echo "No committed secrets detected."
